# Feature 016: every push and pull request builds the whole solution (the app, the tests and the AppHost) and runs
# every test. The tests start a Postgres Testcontainer, which the runner's Docker provides. The design-token parity
# test skips itself when the browser extension isn't checked out next to this repo.
# release.yml calls this workflow before it builds an image, so a tag never publishes untested code.
name: CI

on:
  push:
    branches: ["**"] # tags are left to release.yml, which runs these same tests itself
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "What to check out (a tag); empty means the event's own ref"
        required: false
        type: string
        default: ""

# A newer push to the same branch cancels the run in progress. The workflow's name is in the group because, when
# release.yml calls this one, github.ref is the caller's (main on a dispatch) and would otherwise share main's group
# and cancel (or be cancelled by) a push's run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # inputs.ref exists only under workflow_call; elsewhere it is empty and the default checkout applies
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the release tags, for the changelog check

      # Released notes are never edited (a stale merge could still put text inside a released section); this
      # fails the push instead of the next release (.github/scripts/changelog.sh, "released")
      - name: Released changelog sections are unchanged
        run: .github/scripts/changelog.sh released

      # Notes live one file per change in changelog.d/, so a merge never touches a shared section. This fails a
      # push with a bad fragment or a "## Unreleased" section (a branch started before that rule), and the next
      # step tests the script itself
      - name: Release notes in changelog.d are well formed
        run: .github/scripts/changelog.sh check

      - name: Changelog script tests
        run: bash .github/scripts/changelog-test.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build
