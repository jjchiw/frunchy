# Features 016 and 018: pushing a tag `vX.Y.Z` runs the tests, then two flows.
#   test -> image   the self-host image: ghcr.io/<repository owner>/frunchy:X.Y.Z for linux/amd64 and linux/arm64
#                   (what deploy/compose.yaml pulls). It never writes `latest`: deployments pin a version or a digest.
#   test -> deploy  Caravana: `aspire deploy` (the AppHost's publishGraph, CosmicChimps.Aspire.Hosting.Caravana) builds
#                   the linux/amd64 image, pushes it as ghcr.io/<owner>/frunchy:X.Y.Z and deploys it, keyless: GitHub's
#                   OIDC token is exchanged for a short-lived Bella Baxter key and `bella run` injects every deploy
#                   parameter (Parameters__<name>) into the command. No deploy secret is stored in GitHub.
# The tests gate both. A pre-release tag (vX.Y.Z-rc.1) builds the self-host image but does not deploy.
#
# To turn the deploy on (docs/deploy-caravana.md, "Deploying from a tag"):
#   - Bella Baxter, project frunchy, environment production: every deploy parameter as a Parameters__<name> key, and a
#     trust domain for GitHub (issuer https://token.actions.githubusercontent.com, role Consumer, claim rules
#     repository_id = this repository's numeric id and environment = production).
#   - GitHub repository variables (not secrets): BELLA_BAXTER_TENANT, BELLA_BAXTER_PROJECT (frunchy), BELLA_BAXTER_ENV
#     (production, the default). The deploy job is skipped while BELLA_BAXTER_PROJECT is empty.
#   - GitHub environment `production`, limited to the tag rule `v*` (Deployment branches and tags).
name: Release

on:
  push:
    tags: ["v*"]

# One release at a time, and a started release is never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # First: the release notes from CHANGELOG.md (the same script and flow as Umbral). A release tag turns
  # "## Unreleased" into the version's section and fails the whole run when Unreleased is empty, so nothing is built
  # or deployed without notes. A pre-release tag writes preview notes and leaves CHANGELOG.md alone.
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir out
          if [[ "$VERSION" == *-* ]]; then
            {
              echo "Prerelease $VERSION: a version to try, not a release. Its self-host image is published by tag only, it is not deployed, and the changelog stays as it was."
              if [ -n "$(.github/scripts/changelog.sh unreleased)" ]; then
                echo
                echo "What is on its way, from the changelog's \"Unreleased\" section:"
                echo
                .github/scripts/changelog.sh unreleased
              fi
            } > out/notes.md
          else
            .github/scripts/changelog.sh notes "$VERSION" >/dev/null 2>&1 ||
              .github/scripts/changelog.sh prepare "$VERSION"
            .github/scripts/changelog.sh notes "$VERSION" > out/notes.md
            cp CHANGELOG.md out/CHANGELOG.md
          fi
          { echo "### Release notes"; echo; cat out/notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out
          if-no-files-found: error

  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: [test, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (a pre-release suffix is allowed)." >&2
            exit 1
          fi
          # GHCR names are lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frunchy" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-publishes on the runner's own platform, so no QEMU is needed for arm64
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Frunchy ${{ steps.name.outputs.version }}"
            echo
            echo "- Image: \`${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pin it as: \`${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Feature 018: the release goes to Caravana with the AppHost's `aspire deploy`. The Aspire CLI is the version pinned in
  # .config/dotnet-tools.json (the same as the Aspire.Hosting package). aspire builds the Frunchy image, pushes it with
  # the ambient docker login (GITHUB_TOKEN) and waits until the app is healthy. Its image is tagged X.Y.Z-amd64: the
  # `image` job owns X.Y.Z (the self-host multi-arch image, same package) and runs at the same time, so sharing the
  # tag would let whichever finishes last overwrite the other.
  deploy:
    needs: [test, changelog]
    if: ${{ !contains(github.ref_name, '-') && vars.BELLA_BAXTER_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write # push the image to GHCR with GITHUB_TOKEN
      id-token: write # the OIDC token Bella Baxter exchanges for its key
    env:
      BELLA_BAXTER_URL: https://api.bella-baxter.io # the API, not the console
      BELLA_BAXTER_TENANT: ${{ vars.BELLA_BAXTER_TENANT }}
      BELLA_BAXTER_PROJECT: ${{ vars.BELLA_BAXTER_PROJECT }}
      BELLA_BAXTER_ENV: ${{ vars.BELLA_BAXTER_ENV || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restores the Aspire CLI pinned in .config/dotnet-tools.json; it runs as `dotnet aspire`
      - name: Restore the Aspire CLI
        run: dotnet tool restore

      # The tag the deployed Frunchy image is pushed with (AppHost: Deploy:ImageTag): the release version plus -amd64
      - name: Name the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "Deploy__ImageTag=$version-amd64" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: cosmic-chimps/bella-baxter-setup-action@cf993ff9e477ec89370abb7f166a4e48a2786693 # v0.1.1-preview.137
        with:
          version: 0.1.1-preview.137
          oidc: 'true'

      # bella run injects the Parameters__<name> keys into aspire's environment only. Nothing here prints them, and
      # aspire marks the secret parameters (caravana-token, db-password, ...) as secret in its own output.
      - name: Deploy to Caravana
        run: bella run -- dotnet aspire deploy --non-interactive

  # Last: the GitHub Release (the changelog section, then GitHub's own commit list) and, for a release, the renamed
  # CHANGELOG.md committed to main. Only after the notes, the image and the deploy succeeded, so a release is never
  # claimed for a rollout that failed (the tag stays, visible and easy to retry); a skipped deploy (a pre-release
  # tag, or no Bella settings yet) doesn't block it.
  release:
    needs: [changelog, image, deploy]
    if: ${{ !cancelled() && needs.changelog.result == 'success' && needs.image.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, push the changelog to main
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: out

      - name: Publish the release
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file out/notes.md "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "Frunchy ${GITHUB_REF_NAME#v}" --notes-file out/notes.md --generate-notes --verify-tag "${args[@]}"
          fi

      # main gets the rename, so the next release starts from an empty "Unreleased". Only when main is still the
      # tagged commit; otherwise its "Unreleased" may hold newer entries, which a rename would wrongly claim.
      # The tag never moves.
      - name: Record the changelog on main
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            exit 0 # a prerelease leaves the changelog alone
          fi
          cp out/CHANGELOG.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            exit 0 # the tagged commit had its section already
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::main has moved past $GITHUB_REF_NAME, so its CHANGELOG.md still lists $VERSION's entries under \"## Unreleased\". On main, run .github/scripts/changelog.sh prepare $VERSION and keep any newer entries under Unreleased."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): release $VERSION" -- CHANGELOG.md
          if ! git push origin HEAD:main; then
            echo "::warning::Couldn't push the changelog to main. On main, run .github/scripts/changelog.sh prepare $VERSION and commit it."
          fi
