# Features 016 and 018: a release runs the tests, then two flows.
#   test -> image   the self-host image: ghcr.io/<repository owner>/frunchy:X.Y.Z for linux/amd64 and linux/arm64
#                   (what deploy/compose.yaml pulls). It never writes `latest`: deployments pin a version or a digest.
#   test -> deploy  Caravana: `aspire deploy` (the AppHost's publishGraph, CosmicChimps.Aspire.Hosting.Caravana) builds
#                   the linux/amd64 image, pushes it as ghcr.io/<owner>/frunchy:X.Y.Z and deploys it, keyless: GitHub's
#                   OIDC token is exchanged for a short-lived Bella Baxter key and `bella run` injects every deploy
#                   parameter (Parameters__<name>) into the command. No deploy secret is stored in GitHub.
# The tests gate both. A pre-release (X.Y.Z-rc.1) builds the self-host image but does not deploy.
#
# Two ways to start it:
#   - Run workflow (preferred): Actions > Release > Run workflow on `main`, with the version (X.Y.Z, no v). The job
#     `changelog` then does what used to be done by hand, on main: it gathers the notes in changelog.d/ into the
#     version's section of CHANGELOG.md (deleting those files), commits that to main as github-actions[bot], tags the
#     commit vX.Y.Z and pushes both in one atomic push. It runs only after the tests passed on that commit of main, so
#     red tests never leave a tag. The tag therefore always contains its own changelog section, and the notes are
#     gone from changelog.d/ before anything else can merge (a branch that adds its own file never conflicts).
#   - Pushing a tag by hand works when the tagged commit already holds its section: .github/scripts/changelog.sh
#     prepare X.Y.Z, commit, tag that commit, push main and the tag together (--atomic). A tag without it is refused.
# Every later job takes the version and the tag from the outputs of `changelog` (never from GITHUB_REF_NAME, which is
# `main` on a dispatch) and checks out the tag, so it builds exactly the tagged commit.
#
# To turn the deploy on (docs/deploy-caravana.md, "Deploying from a tag"):
#   - Bella Baxter, project frunchy, environment production: every deploy parameter as a Parameters__<name> key, and a
#     trust domain for GitHub (issuer https://token.actions.githubusercontent.com, role Consumer, claim rules
#     repository_id = this repository's numeric id and environment = production).
#   - GitHub repository variables (not secrets): BELLA_BAXTER_TENANT, BELLA_BAXTER_PROJECT (frunchy), BELLA_BAXTER_ENV
#     (production, the default). The deploy job is skipped while BELLA_BAXTER_PROJECT is empty.
#   - GitHub environment `production`, Deployment branches and tags > Selected: the tag rule `v*` (tag pushes) AND the
#     branch rule `main` (Run workflow). GitHub checks the rule against the ref the workflow runs on, which is `main`
#     on a dispatch, so without the branch rule the deploy job is refused there. The Bella trust domain's
#     `environment = production` claim doesn't change: the claim is the environment's name, not the ref.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (no v)"
        required: true
        type: string

# One release at a time, and a started release is never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # First: decide the version and, on a dispatch, cut the release. The notes come from changelog.d/ (one file per
  # change) and CHANGELOG.md (the same script as Umbral). A release gathers the files into the version's section of
  # CHANGELOG.md, deletes them, and fails the whole run when changelog.d/ has no notes, so nothing is built or
  # deployed without notes. A pre-release writes preview notes and leaves CHANGELOG.md and changelog.d/ alone.
  changelog:
    # The tests come first: a dispatch tags only a commit whose tests passed, and a failing test leaves no tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # a dispatch pushes the changelog commit and the tag to the repository
    outputs:
      version: ${{ steps.ver.outputs.version }} # X.Y.Z or X.Y.Z-suffix
      tag: ${{ steps.ver.outputs.tag }} # vX.Y.Z...
      prerelease: ${{ steps.ver.outputs.prerelease }} # "true" or "false"
    steps:
      # A dispatch works on the commit of main the run started from, the one the tests just passed on (full history,
      # to push to main and to see every tag): if main moved meanwhile, the atomic push below is refused and nothing
      # is tagged. A tag push works on its own tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Decide the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main (it was run on $GITHUB_REF): the release commit and the tag are made on main."
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not X.Y.Z (a pre-release suffix is allowed, like 0.2.0-rc.1)."
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Before anything is written: a tag that exists, here or on the remote, must never be reused
      - name: Refuse a tag that already exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags --force -q origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::The tag $TAG already exists. Pick another version, or delete the tag first (git push --delete origin $TAG, and gh release delete $TAG --yes if it has a GitHub Release) and run this workflow again."
            exit 1
          fi

      - name: Notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          mkdir out
          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "Prerelease $VERSION: a version to try, not a release. Its self-host image is published by tag only, it is not deployed, and the changelog stays as it was."
              if [ -n "$(.github/scripts/changelog.sh unreleased)" ]; then
                echo
                echo "What is on its way, from the notes waiting in changelog.d:"
                echo
                .github/scripts/changelog.sh unreleased
              fi
            } > out/notes.md
          else
            # A pushed tag must already hold its own section (prepare, commit, then tag that commit), so every
            # release tag records its notes and `changelog.sh released` can protect them; the button does that
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && ! .github/scripts/changelog.sh notes "$VERSION" >/dev/null 2>&1; then
              echo "::error::The tag v$VERSION has no \"## $VERSION\" section in its CHANGELOG.md. Release with Actions > Release > Run workflow, or by hand: .github/scripts/changelog.sh prepare $VERSION, commit, tag that commit, then git push --atomic origin main v$VERSION. Delete this tag first: git push --delete origin v$VERSION."
              exit 1
            fi
            # Re-running a dispatch for a version whose section already exists reuses it; otherwise `prepare`
            # gathers changelog.d/ into it (and deletes the files, committed below), and it fails the run with
            # "no notes in changelog.d" when there is nothing to release
            .github/scripts/changelog.sh notes "$VERSION" >/dev/null 2>&1 ||
              .github/scripts/changelog.sh prepare "$VERSION" ||
              { echo "::error::Nothing to release: no notes in changelog.d (each change adds a file there; see changelog.d/README.md), or a note file is malformed (.github/scripts/changelog.sh check)."; exit 1; }
            .github/scripts/changelog.sh notes "$VERSION" > out/notes.md
            cp CHANGELOG.md out/CHANGELOG.md
          fi
          { echo "### Release notes"; echo; cat out/notes.md; } >> "$GITHUB_STEP_SUMMARY"

      # Dispatch only: commit the renamed changelog to main, tag that commit and push both at once (atomic: if main
      # moved meanwhile, nothing is pushed and the run fails, so run it again). A pre-release only gets its tag.
      # A tag pushed with GITHUB_TOKEN does NOT start another workflow run, which is what we want: this run goes on to
      # build and deploy it. (For the same reason the changelog commit doesn't start ci.yml on main; `test` already
      # ran the same tests on the commit underneath it, which only gains the changelog section.)
      - name: Commit the changelog, tag and push
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRERELEASE" != "true" ]; then
            # `prepare` rewrote CHANGELOG.md and deleted the fragments in changelog.d/: stage both (-A takes the
            # deletions), then ask the index, so a deleted file counts as a change. Nothing else is staged.
            git add -A -- CHANGELOG.md changelog.d
            if ! git diff --cached --quiet -- CHANGELOG.md changelog.d; then
              git commit -m "chore(release): $VERSION"
            fi
          fi
          git tag -a "$TAG" -m "$TAG"
          if [ "$PRERELEASE" = "true" ]; then
            git push origin "refs/tags/$TAG"
          else
            git push --atomic origin HEAD:main "refs/tags/$TAG"
          fi
          echo "Tagged $TAG at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out
          if-no-files-found: error

  # The same tests as every push, on the commit the run started from: main's head for a dispatch (the release commit only adds the changelog
  # section), the tagged commit for a tag push
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: [test, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      - name: Name the image
        id: name
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
          TAG: ${{ needs.changelog.outputs.tag }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag $TAG is not vMAJOR.MINOR.PATCH (a pre-release suffix is allowed)." >&2
            exit 1
          fi
          # GHCR names are lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frunchy" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # the tagged commit (github.sha is main before the release commit on a dispatch)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-publishes on the runner's own platform, so no QEMU is needed for arm64
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
            org.opencontainers.image.revision=${{ steps.name.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### Frunchy ${{ steps.name.outputs.version }}"
            echo
            echo "- Image: \`${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pin it as: \`${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Feature 018: the release goes to Caravana with the AppHost's `aspire deploy`. The Aspire CLI is the version pinned in
  # .config/dotnet-tools.json (the same as the Aspire.Hosting package). aspire builds the Frunchy image, pushes it with
  # the ambient docker login (GITHUB_TOKEN) and waits until the app is healthy. Its image is tagged X.Y.Z-amd64: the
  # `image` job owns X.Y.Z (the self-host multi-arch image, same package) and runs at the same time, so sharing the
  # tag would let whichever finishes last overwrite the other.
  # `environment: production` is checked against the ref the run is on: `main` on a dispatch, the tag on a tag push
  # (see the header: the environment needs both rules).
  deploy:
    needs: [test, changelog]
    if: ${{ needs.changelog.outputs.prerelease != 'true' && vars.BELLA_BAXTER_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write # push the image to GHCR with GITHUB_TOKEN
      id-token: write # the OIDC token Bella Baxter exchanges for its key
    env:
      BELLA_BAXTER_URL: https://api.bella-baxter.io # the API, not the console
      BELLA_BAXTER_TENANT: ${{ vars.BELLA_BAXTER_TENANT }}
      BELLA_BAXTER_PROJECT: ${{ vars.BELLA_BAXTER_PROJECT }}
      BELLA_BAXTER_ENV: ${{ vars.BELLA_BAXTER_ENV || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restores the Aspire CLI pinned in .config/dotnet-tools.json; it runs as `dotnet aspire`
      - name: Restore the Aspire CLI
        run: dotnet tool restore

      # The tag the deployed Frunchy image is pushed with (AppHost: Deploy:ImageTag): the release version plus -amd64
      - name: Name the release
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
          TAG: ${{ needs.changelog.outputs.tag }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $TAG is not vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "Deploy__ImageTag=$VERSION-amd64" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: cosmic-chimps/bella-baxter-setup-action@cf993ff9e477ec89370abb7f166a4e48a2786693 # v0.1.1-preview.137
        with:
          version: 0.1.1-preview.137
          oidc: 'true'

      # bella run injects the Parameters__<name> keys into aspire's environment only. Nothing here prints them, and
      # aspire marks the secret parameters (caravana-token, db-password, ...) as secret in its own output.
      - name: Deploy to Caravana
        run: bella run -- dotnet aspire deploy --non-interactive

  # Last: the GitHub Release (the changelog section, then GitHub's own commit list) and, for a tag push, the renamed
  # CHANGELOG.md committed to main (a dispatch committed it to main before tagging). Only after the notes, the image
  # and the deploy succeeded, so a release is never claimed for a rollout that failed (the tag stays, visible and easy
  # to retry); a skipped deploy (a pre-release, or no Bella settings yet) doesn't block it.
  release:
    needs: [changelog, image, deploy]
    if: ${{ !cancelled() && needs.changelog.result == 'success' && needs.image.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, push the changelog to main
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.changelog.outputs.tag }}
      VERSION: ${{ needs.changelog.outputs.version }}
      PRERELEASE: ${{ needs.changelog.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: out

      - name: Publish the release
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file out/notes.md "${args[@]}"
          else
            gh release create "$TAG" --title "Frunchy $VERSION" --notes-file out/notes.md --generate-notes --verify-tag "${args[@]}"
          fi
