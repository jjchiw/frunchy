# Feature 016: pushing a tag `vX.Y.Z` runs the tests, then builds Frunchy for linux/amd64 and linux/arm64 and pushes
# ghcr.io/<repository owner>/frunchy:X.Y.Z. It never writes `latest`: deployments pin a version or a digest.
# The `image` job's outputs (`image` and `digest`) are for the deploy job that comes with PublishToCaravana, which
# runs the image as image@digest. Only GITHUB_TOKEN is used.
name: Release

on:
  push:
    tags: ["v*"]

# One release at a time, and a started release is never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (a pre-release suffix is allowed)." >&2
            exit 1
          fi
          # GHCR names are lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frunchy" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-publishes on the runner's own platform, so no QEMU is needed for arm64
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Frunchy ${{ steps.name.outputs.version }}"
            echo
            echo "- Image: \`${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pin it as: \`${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
