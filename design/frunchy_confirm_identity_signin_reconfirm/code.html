<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm it's you - Frunchy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            background: '#0f131c',
            surface: {
              DEFAULT: '#181c24',
              secondary: '#1c2028',
              tertiary: '#262a33',
            },
            text: {
              DEFAULT: '#dfe2ee',
              muted: '#bcc9cd',
              outline: '#3d494c',
            },
            primary: {
              DEFAULT: '#4cd7f6',
              on: '#003640',
            },
            secondary: '#c0c1ff',
            error: {
              DEFAULT: '#ffb4ab',
            },
          },
          borderRadius: {
            'custom-sm': '8px',
            'custom-card': '16px',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-text font-sans antialiased min-h-screen flex flex-col justify-between p-4 md:p-8">
  <!-- Minimal Header -->
  <header class="w-full max-w-[1360px] mx-auto flex items-center justify-between py-4">
    <a href="/" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-custom-sm bg-surface border border-text-outline/40 flex items-center justify-center text-primary">
        <svg class="w-5 h-5 text-primary" viewBox="0 0 32 32" fill="currentColor">
          <rect x="4" y="4" width="24" height="24" rx="6" fill="#1c2028" stroke="#4cd7f6" stroke-width="2"/>
          <path d="M10 10h12v3H10zM10 16h8v3h-8zM10 22h5v3h-5z" fill="#4cd7f6"/>
          <circle cx="21" cy="20" r="3" fill="#c0c1ff" />
        </svg>
      </div>
      <span class="text-xl font-extrabold tracking-tight text-text">Frunchy</span>
    </a>
    <a href="/account" class="text-xs font-semibold text-text-muted hover:text-text transition">Cancel</a>
  </header>

  <!-- Reconfirm Interstitial Card -->
  <main class="w-full max-w-md mx-auto my-auto space-y-6">
    <div class="bg-surface border border-text-outline/30 rounded-custom-card p-6 md:p-8 shadow-2xl space-y-5">
      <div class="w-10 h-10 rounded-custom-sm bg-primary/10 border border-primary/30 flex items-center justify-center text-primary">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>

      <div>
        <span class="text-[11px] font-bold uppercase tracking-widest text-primary">Security Check</span>
        <h1 class="text-2xl font-extrabold text-text mt-1">Confirm it's you</h1>
        <p class="text-xs text-text-muted mt-2 leading-relaxed">
          To perform this sensitive action, please re-authenticate with the sign-in method you used.
        </p>
      </div>

      <!-- Error variant notice -->
      <div id="reconfirm-error" class="hidden p-3.5 rounded-custom-sm bg-error/10 border border-error/30 flex items-start gap-2.5">
        <svg class="w-4 h-4 text-error shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <p class="text-xs text-error font-medium">We couldn't confirm it's you. Try again with the sign-in method you used.</p>
      </div>

      <!-- Action Button for Provider -->
      <div class="space-y-2.5 pt-2">
        <button class="w-full h-11 px-4 rounded-custom-sm bg-[#5865F2] hover:bg-[#4752c4] text-white font-semibold text-sm flex items-center justify-center gap-2.5 transition active:scale-[0.99] shadow-lg shadow-[#5865F2]/10">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          Continue with Discord
        </button>
      </div>

      <div class="pt-4 border-t border-text-outline/20 text-center">
        <a href="/account" class="text-xs text-text-muted hover:text-text transition">Return to account settings</a>
      </div>
    </div>

    <!-- Toggle Error for Preview -->
    <div class="text-center">
      <button onclick="document.getElementById('reconfirm-error').classList.toggle('hidden')" class="text-[11px] text-text-muted underline hover:text-text">
        Toggle reconfirm error state
      </button>
    </div>
  </main>

  <footer class="w-full max-w-[1360px] mx-auto text-center py-4 text-xs text-text-muted/60">
    Frunchy, a Last.fm for anime
  </footer>
</body>
</html>
