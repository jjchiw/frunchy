<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neo-Scrobble, sharpened: dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0f131c}
a{color:#4cd7f6}a:hover{color:#acedff}
</style>
</helmet>
<div style="min-height: 100%; background: #0f131c; color: #dfe2ee; font-family: 'Plus Jakarta Sans', sans-serif">
  <header style="border-bottom: 1px solid rgba(255,255,255,0.06)">
    <div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #dfe2ee"><span style="width: 32px; height: 32px; border-radius: 9px; background: #4cd7f6; color: #003640; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center">F</span><span style="font-weight: 800; font-size: 22px; letter-spacing: -0.03em">frunchy</span></a>
      <nav style="display: flex; gap: 4px" aria-label="Account"><a href="#" style="padding: 12px; font-weight: 600; font-size: 13px; color: #bcc9cd; text-decoration: none">jjchiw</a><a href="#" style="padding: 12px; font-weight: 600; font-size: 13px; color: #bcc9cd; text-decoration: none">Account</a><button type="button" style="font: inherit; font-weight: 600; font-size: 13px; background: none; border: 0; padding: 12px; color: #bcc9cd">Sign out</button></nav>
    </div>
  </header>
  <main style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 44px">
    <section style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; color: #bcc9cd">JJ <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">@jjchiw</span> has watched</span>
        <span style="font-weight: 800; font-size: 120px; line-height: 112px; letter-spacing: -0.05em">1,284 <span style="font-size: 32px; letter-spacing: -0.02em; color: #4cd7f6">episodes</span></span>
        <span style="font-size: 18px; color: #bcc9cd">486 hours across 69 series · last sync 2 h ago</span>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap"><a href="#" style="font-weight: 700; padding: 13px 22px; background: #4cd7f6; color: #003640; text-decoration: none; border-radius: 12px">Anime DNA</a><a href="#" style="font-weight: 700; padding: 12px 20px; border: 1px solid rgba(255,255,255,0.14); color: #dfe2ee; text-decoration: none; border-radius: 12px">2026 in review</a></div>
    </section>
    <section aria-labelledby="recent" style="display: flex; flex-direction: column; gap: 16px">
      <h2 id="recent" style="margin: 0; font-weight: 700; font-size: 20px">Recently watched</h2>
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 16px">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
          <a href="#" style="border-radius: 16px; background: #181c24; border: 1px solid rgba(255,255,255,0.06); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: #dfe2ee; min-width: 0">
            <span style="aspect-ratio: 16 / 9; background: #262a33; display: flex; align-items: flex-end"><span style="height: 4px; background: #4cd7f6; width: {{r.pct}}"></span></span>
            <span style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 15px; line-height: 20px">{{r.series}}</span><span style="font-size: 13px; color: #bcc9cd">{{r.meta}}</span></span>
          </a>
        </sc-for>
      </div>
    </section>
    <section aria-labelledby="genres" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 id="genres" style="margin: 0; font-weight: 700; font-size: 20px">Top genres</h2>
        <sc-for list="{{genres}}" as="g" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 100px minmax(0, 1fr) 48px; gap: 12px; align-items: center"><span style="font-size: 14px">{{g.name}}</span><span style="height: 12px; border-radius: 4px; background: #262a33; display: flex"><span style="height: 12px; border-radius: 4px; background: {{g.color}}; width: {{g.w}}"></span></span><span style="font-weight: 700; font-size: 14px; text-align: right">{{g.pct}}</span></div>
        </sc-for>
      </div>
      <div style="border-radius: 16px; padding: 24px; background: #181c24; border: 1px solid rgba(76,215,246,0.35); display: flex; flex-direction: column; gap: 8px; align-self: start">
        <span style="font-size: 13px; font-weight: 600; color: #bcc9cd">Most watched this year</span>
        <span style="font-weight: 800; font-size: 36px; line-height: 40px; letter-spacing: -0.03em">One Piece</span>
        <span style="font-size: 15px; color: #bcc9cd">212 episodes · 74 hours · Toei Animation</span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const shades = ['#4cd7f6', '#22c7e8', '#06b6d4', '#0b93ad', '#0e7489'];
    return {
      recent: [
        { series: "Frieren: Beyond Journey's End", meta: 'Ep. 28 · 24 min · 2 h ago', pct: '100%' },
        { series: 'Jujutsu Kaisen', meta: 'Ep. 47 · yesterday', pct: '100%' },
        { series: 'One Piece', meta: 'Ep. 1110 · 62%', pct: '62%' },
        { series: 'Engage Kiss', meta: 'Ep. 13 · last week', pct: '100%' }
      ],
      genres: [['Action', 31], ['Adventure', 24], ['Fantasy', 18], ['Romance', 14], ['Comedy', 13]]
        .map(([name, n], i) => ({ name, pct: n + '%', w: (n * 3) + '%', color: shades[i] }))
    };
  }
}
</script>
</body>
</html>
